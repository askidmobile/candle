[package]
name = "candle-nn"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
candle = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
objc2-metal = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
libc = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
criterion = { workspace = true }

[features]
default = []
accelerate = ["dep:accelerate-src", "candle/accelerate"]
cuda = ["candle/cuda"]
# MoE CUDA-GEMM (moe_gemm/moe_gemm_gguf через FFI в libmoe.a). OFF по умолчанию:
# T-331 Фаза 0 удалила libmoe.a (dynamic-loading) → FFI-символы не резолвятся.
# Включать только вместе с восстановлением libmoe.a в candle-kernels под
# dynamic-loading-совместимой схемой. См. candle-nn/src/moe.rs.
cuda_moe = ["cuda"]
cudnn = ["candle/cudnn"]
mkl = ["dep:intel-mkl-src", "candle/mkl"]
metal = ["candle/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
metal-debug-labels = ["metal", "candle/metal-debug-labels"]

[[bench]]
name = "bench_main"
harness = false
